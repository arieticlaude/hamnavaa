<title>عیب‌یابی اتصال پنل | هم‌نوا</title>
<link rel="stylesheet" href="panel.css?v=20261105b">
<style>
  .dg{max-width:560px;margin:0 auto;padding:18px 16px 60px}
  .dg h1{font-size:22px;color:#163932;margin:6px 0 4px}
  .dg p{color:#55655E;margin:4px 0 12px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin:8px 0;border-radius:14px;background:#fff;border:1px solid rgba(27,43,38,.12)}
  .row b{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:15px;background:#9aa7a1}
  .row.ok b{background:#2F7A55}.row.bad b{background:#B04A42}.row.wait b{background:#9aa7a1}
  .row small{display:block;color:#6b7b74;direction:ltr;text-align:right;word-break:break-all}
  .sum{padding:14px;border-radius:14px;background:#F8EFD9;border:1px solid #E8C486;margin:12px 0;font-weight:700;line-height:1.9}
  .btns button{font:inherit;font-weight:700;padding:10px 16px;margin:4px;border-radius:12px;border:1px solid #3A6259;background:#3A6259;color:#fff;cursor:pointer}
  .btns button.alt{background:#fff;color:#163932}
  pre{white-space:pre-wrap;direction:ltr;text-align:left;background:#fff;border:1px solid rgba(27,43,38,.12);border-radius:12px;padding:10px;font-size:12px}
</style>
</head>
<body>
<main class="dg">
  <h1>عیب‌یابی اتصال پنل</h1>
  <p>این صفحه چند آزمایش کوچک انجام می‌دهد تا معلوم شود دقیقاً چه چیزی در اینترنت یا مرورگر شما پنل را کند یا بسته می‌کند. هیچ رمز و اطلاعاتی فرستاده نمی‌شود. چند ثانیه صبر کنید، بعد «کپی گزارش» را بزنید و برای مدیر بفرستید.</p>
  <div id="rows"></div>
  <div class="sum" id="sum">در حال آزمایش…</div>
  <div class="btns">
    <button type="button" id="copy">کپی گزارش</button>
    <button type="button" class="alt" id="again">آزمایش دوباره</button>
    <button type="button" class="alt" id="back">برگشت به پنل</button>
  </div>
  <pre id="rep"></pre>
</main>
<script src="guard.js"></script>
